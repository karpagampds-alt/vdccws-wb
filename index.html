<script>
const FU=[["petrol","Petrol","L"],["diesel","Diesel","L"],["cng","CNG","kg"],["xp","Extra Premium Petrol","L"],["green","Green Diesel","L"]];
const $=id=>document.getElementById(id);
const n=v=>parseFloat(v)||0, f2=v=>v.toLocaleString("en-IN",{maximumFractionDigits:2}), rs=v=>"₹"+f2(v);
let days={}, cur="", D=null, col=null, dirty=false, users={}, me=null, ucol=null;
const isAdm=()=>!!(me&&users[me]&&users[me].role==="admin");
const sha=async s=>[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("");
const hp=(u,p)=>sha(u+":"+p);
const LIST=[["ho","HO PETROL BUNK"],["arcot","ARCOT PETROL BUNK"],["cheyyar","CHEYYAR PETROL BUNK"],["katpadi","KATPADI PETROL BUNK"],["thirupathur","THIRUPATHUR PETROL BUNK"]];
let BK="ho",BN=LIST[0][1];const bunks={};LIST.forEach(([k,v])=>bunks[k]=v);const did=d=>BK+"__"+d;
const today=()=>{const d=new Date();return new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10)};
function blank(date){
  const pl=Object.values(days).filter(x=>x.bk===BK&&x.date<date).sort((a,b)=>a.date<b.date?-1:1), p=pl.length?pl[pl.length-1]:null;
  const d={date,bk:BK,bunk:BN,sm:"",fuels:{},pumps:[]};
  FU.forEach(([k])=>{const pf=p&&p.fuels&&p.fuels[k];
    d.fuels[k]={ob:pf?String(+(n(pf.ob)+n(pf.supply)-fuelSales(p,k)).toFixed(2)):"",supply:"",rate:pf?pf.rate:""};});
  if(p&&p.pumps)p.pumps.forEach(x=>d.pumps.push({fuel:x.fuel,name:x.name,open:x.close,close:""}));
  else[["petrol",2],["diesel",2],["cng",1],["xp",1],["green",1]].forEach(([k,c])=>{for(let i=1;i<=c;i++)d.pumps.push({fuel:k,name:"Pump "+i,open:"",close:""})});
  return d;}
const fuelSales=(d,k)=>(d.pumps||[]).filter(p=>p.fuel===k&&p.close!=="").reduce((s,p)=>s+Math.max(0,n(p.close)-n(p.open)),0);
function calc(d,k){const x=d.fuels[k]||{},s=fuelSales(d,k),c=n(x.ob)+n(x.supply)-s;return{s,c,sv:s*n(x.rate),cv:c*n(x.rate)}}
function build(){
  $("sm").value=D.sm||"";let h="";
  FU.forEach(([k,nm,u])=>{h+=`<div class="card"><h2>${nm} <span class="mu">(${u})</span></h2>
  <div class="g3"><div><label>OB (opening stock)</label><input type="number" inputmode="decimal" data-f="${k}" data-k="ob" value="${D.fuels[k].ob}"></div>
  <div><label>Supply received</label><input type="number" inputmode="decimal" data-f="${k}" data-k="supply" value="${D.fuels[k].supply}"></div>
  <div><label>Rate / ${u} (₹)</label><input type="number" inputmode="decimal" data-f="${k}" data-k="rate" value="${D.fuels[k].rate}"></div></div>
  <div class="mu" style="margin-bottom:4px">Pump meter readings</div>`;
  D.pumps.forEach((p,i)=>{if(p.fuel!==k)return;
    h+=`<div class="pr"><div><label>Pump</label><input data-p="${i}" data-k="name" value="${p.name}"></div>
    <div><label>Opening</label><input type="number" inputmode="decimal" data-p="${i}" data-k="open" value="${p.open}"></div>
    <div><label>Closing</label><input type="number" inputmode="decimal" data-p="${i}" data-k="close" value="${p.close}"></div>
    <div><label>Sales</label><div id="ps${i}" style="padding:8px 0">0</div></div></div>`;});
  h+=`<button class="s" data-add="${k}">+ Add pump</button><div class="out" id="o_${k}"></div></div>`;});
  $("f").innerHTML=h;refresh();applyLock();}
function applyLock(){const x=days[did(cur)],saved=!!x,lock=saved&&!x.unlocked&&!isAdm();
  document.querySelectorAll("#f input,#f button,#sm").forEach(e=>e.disabled=lock);
  $("sv").hidden=lock;const b=$("ulk");b.hidden=!(isAdm()&&saved);b.textContent=x&&x.unlocked?"🔒 Lock this report again":"🔓 Allow bunk to edit this report";
  $("lkm").textContent=lock?"🔒 Report saved and locked. Only admin can allow editing.":(saved&&x.unlocked&&!isAdm()?"🔓 Admin has allowed editing. After you save, it locks again.":"");}
function refresh(){let ts=0,tv=0,tc=0;
  D.pumps.forEach((p,i)=>{const e=$("ps"+i);if(e)e.textContent=p.close===""?"–":f2(Math.max(0,n(p.close)-n(p.open)))});
  FU.forEach(([k,nm,u])=>{const r=calc(D,k);ts+=r.sv;tc+=r.cv;
    $("o_"+k).innerHTML=`<div>Sales <b>${f2(r.s)} ${u}</b></div><div>Sales value <b>${rs(r.sv)}</b></div><div>Closing balance <b>${f2(r.c)} ${u}</b></div><div>Stock value <b>${rs(r.cv)}</b></div>`;});
  $("tot").innerHTML=`<div>Total sales value <b>${rs(ts)}</b></div><div>Total stock value <b>${rs(tc)}</b></div>`;}
function load(date){cur=date;dirty=false;$("dt").value=date;D=JSON.parse(JSON.stringify(days[did(date)]||blank(date)));FU.forEach(([k])=>{if(!D.fuels[k])D.fuels[k]={ob:"",supply:"",rate:""};if(!D.pumps.some(p=>p.fuel===k))D.pumps.push({fuel:k,name:"Pump 1",open:"",close:""})});build();$("st").textContent=days[did(date)]?"Saved report loaded.":"New day: opening values filled from previous day.";}
$("f").addEventListener("input",e=>{const t=e.target;dirty=true;
  if(t.dataset.f)D.fuels[t.dataset.f][t.dataset.k]=t.value;
  else if(t.dataset.p!==undefined)D.pumps[t.dataset.p][t.dataset.k]=t.value;refresh();});
$("f").addEventListener("click",e=>{const k=e.target.dataset.add;if(!k)return;dirty=true;
  D.pumps.push({fuel:k,name:"Pump "+(D.pumps.filter(p=>p.fuel===k).length+1),open:"",close:""});build();});
$("sm").oninput=e=>{D.sm=e.target.value;dirty=true};
$("dt").onchange=e=>e.target.value&&load(e.target.value);
$("sv").onclick=async()=>{const ex=days[did(cur)];if(ex&&!ex.unlocked&&!isAdm()){$("st").textContent="Locked. Ask admin for permission to edit.";return}
  if(!isAdm())D.unlocked=false;D.date=cur;D.bk=BK;D.bunk=BN;
  try{if(col)await col.doc(did(cur)).set(D);else{days[did(cur)]=D;localStorage.setItem("pb",JSON.stringify(days));}
    days[did(cur)]=JSON.parse(JSON.stringify(D));dirty=false;load(cur);$("st").textContent="✓ Saved: "+BN+" – "+cur+(isAdm()?"":" (locked – admin permission needed to edit)");}catch(e){$("st").textContent="Could not save. Please try again.";}};
function office(){const dd=$("od").value||today();
  let h=`<tr><th rowspan="2">Bunk</th>`+FU.map(f=>`<th colspan="4">${f[1].replace(" Petrol","")} (${f[2]})</th>`).join("")+`<th rowspan="2">Sales ₹</th><th rowspan="2">CB ₹</th><th rowspan="2">By</th></tr><tr>`+FU.map(()=>"<th>OB</th><th>Supply</th><th>Sales</th><th>CB</th>").join("")+"</tr>";
  const T=FU.map(()=>[0,0,0,0]);let TS=0,TC=0;
  LIST.forEach(([b,nm])=>{const d=days[b+"__"+dd];
    if(!d){h+=`<tr class="c" data-b="${b}"><td>${nm}</td><td colspan="23" class="mu" style="text-align:center">Not submitted</td></tr>`;return}
    let sv=0,cv=0;const c=FU.map(([f],i)=>{const r=calc(d,f),x=d.fuels[f]||{},a=[n(x.ob),n(x.supply),r.s,r.c];sv+=r.sv;cv+=r.cv;a.forEach((v,j)=>T[i][j]+=v);return a.map(v=>`<td>${f2(v)}</td>`).join("")}).join("");TS+=sv;TC+=cv;
    h+=`<tr class="c" data-b="${b}"><td>${nm}</td>${c}<td>${f2(sv)}</td><td>${f2(cv)}</td><td>✓ ${d.sm||""}</td></tr>`;});
  h+=`<tr><th>TOTAL</th>`+T.map(a=>a.map(v=>`<th>${f2(v)}</th>`).join("")).join("")+`<th>${f2(TS)}</th><th>${f2(TC)}</th><th></th></tr>`;
  $("hist").innerHTML=h;}
$("od").onchange=office;
function offData(){const dd=$("od").value||today();
  const top=["Bunk"],sub=[""];FU.forEach(([,nm,u])=>{top.push(nm+" ("+u+")","","","");sub.push("OB","Supply","Sales","CB")});top.push("Sales ₹","CB ₹","By");sub.push("","","");
  const T=FU.map(()=>[0,0,0,0]);let TS=0,TC=0;const rows=[];
  LIST.forEach(([b,nm])=>{const d=days[b+"__"+dd];if(!d){rows.push([nm,"Not submitted"]);return}
    const r=[nm];let sv=0,cv=0;FU.forEach(([f],i)=>{const q=calc(d,f),x=d.fuels[f]||{},a=[n(x.ob),n(x.supply),q.s,q.c];sv+=q.sv;cv+=q.cv;a.forEach((v,j)=>T[i][j]+=v);r.push(...a.map(v=>+v.toFixed(2)))});
    TS+=sv;TC+=cv;r.push(+sv.toFixed(2),+cv.toFixed(2),d.sm||"");rows.push(r)});
  const t=["TOTAL"];T.forEach(a=>t.push(...a.map(v=>+v.toFixed(2))));t.push(+TS.toFixed(2),+TC.toFixed(2),"");rows.push(t);
  return{dd,top,sub,rows}}
async function dl(kind){const m=$("dst");const dw={save:async({filename,data})=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data]));a.download=filename;document.body.appendChild(a);a.click();a.remove()}};
  if(!dw){m.textContent="Download is not available here.";return}
  const{dd,top,sub,rows}=offData();let data;
  try{
    if(kind==="x"){if(!window.XLSX)throw 0;
      const aoa=[["VDCCWS Petrol Bunk – Office Summary"],["Date",dd],[],top,sub,...rows.map(r=>r.length===2?[r[0],r[1]]:r)];
      const ws=XLSX.utils.aoa_to_sheet(aoa);ws["!merges"]=FU.map((_,i)=>({s:{r:3,c:1+i*4},e:{r:3,c:4+i*4}}));
      ws["!cols"]=[{wch:28}].concat(top.slice(1).map(()=>({wch:11})));
      const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"Office Summary");
      data=XLSX.write(wb,{type:"array",bookType:"xlsx"});
    }else{if(!window.jspdf)throw 0;
      const doc=new jspdf.jsPDF({orientation:"landscape",format:"a3"});
      doc.setFontSize(14);doc.text("VDCCWS Petrol Bunk - Office Summary  |  Date: "+dd,14,14);
      const h1=top.map((t,i)=>i>=1&&i<=20?(i%4===1?{content:t,colSpan:4,styles:{halign:"center"}}:null):t.replace("₹","Rs")).filter(x=>x!==null);
      const h2=sub.map(s=>s);
      const body=rows.map(r=>r.length===2?[r[0],{content:r[1],colSpan:23,styles:{halign:"center",textColor:120}}]:r.map((v,i)=>typeof v==="number"?f2(v):v));
      doc.autoTable({head:[h1,h2],body,startY:20,theme:"grid",styles:{fontSize:7,halign:"right",cellPadding:1.5},headStyles:{halign:"center",fillColor:[11,110,79]},columnStyles:{0:{halign:"left",fontStyle:"bold",cellWidth:38}},didParseCell:x=>{if(x.row.index===rows.length-1&&x.section==="body")x.cell.styles.fontStyle="bold"}});
      data=doc.output("arraybuffer");}
    await dw.save({filename:"Office-Summary-"+dd+(kind==="x"?".xlsx":".pdf"),data});m.textContent="✓ Download ready";
  }catch(e){m.textContent=e&&e.code==="declined"?"Download cancelled.":"Could not create the file. Please try again."}}
$("dx").onclick=()=>dl("x");$("dp").onclick=()=>dl("p");
$("hist").onclick=e=>{const r=e.target.closest("tr[data-b]");if(r){BK=r.dataset.b;BN=bunks[BK];fillB();tab(1);load($("od").value||today())}};
function tab(i){if(i===2&&!isAdm())i=1;$("v1").hidden=i!==1;$("v2").hidden=i!==2;$("v3").hidden=i!==3;[1,2,3].forEach(k=>$("t"+k).classList.toggle("on",i===k));if(i===2)office();if(i===3)acct();}
$("t1").onclick=()=>tab(1);$("t2").onclick=()=>tab(2);$("t3").onclick=()=>tab(3);
function enter(u){me=u;try{sessionStorage.setItem("pbu",u)}catch(e){}const x=users[u],a=isAdm();
  $("lg").hidden=true;$("app").hidden=false;$("t2").hidden=!a;$("adm").hidden=!a;$("who").textContent="Logged in: "+x.name+(a?" (Admin)":"");
  if(!a){BK=x.bunk;BN=bunks[BK]}fillB();$("bk").disabled=!a;tab(1);load(cur);}
$("li").onclick=async()=>{const u=$("lu").value.trim().toLowerCase();$("lm").textContent="Please wait...";
  try{await auth.signInWithEmailAndPassword(u+"@"+DOMAIN,$("lp").value);$("lp").value="";$("lm").textContent=""}catch(e){$("lm").textContent="Wrong user ID or password."}};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("li").click()};
$("ulk").onclick=async()=>{const id=did(cur),x=days[id];if(!x||!isAdm()||!col)return;
  try{await col.doc(id).update({unlocked:!x.unlocked});x.unlocked=!x.unlocked;load(cur);$("st").textContent=x.unlocked?"Unlocked: bunk can edit this report once.":"Locked again."}catch(e){$("st").textContent="Could not change the lock. Try again."}};
$("lo").onclick=()=>auth.signOut();
function acct(){if(isAdm())$("ul").innerHTML='<p class="mu">To reset another user\u2019s password: Firebase console \u2192 Authentication \u2192 Users \u2192 \u22ee \u2192 Reset password (or delete and add the user again).</p>';}
$("ul").onclick=async e=>{const u=e.target.dataset.u;if(!u||!isAdm())return;const v=$("np_"+u).value;
  if(v.length<4){$("pm").textContent="Password must be at least 4 characters.";return}
  try{await ucol.doc(u).update({hash:await hp(u,v)});$("np_"+u).value="";$("pm").textContent="✓ Password updated for "+u}catch(e){$("pm").textContent="Could not update. Try again."}};
$("cp").onclick=async()=>{const v=$("pw1").value,cu=auth.currentUser;if(v.length<6){$("pm").textContent="New password must be at least 6 characters.";return}
  try{await cu.reauthenticateWithCredential(firebase.auth.EmailAuthProvider.credential(cu.email,$("pw0").value));await cu.updatePassword(v);$("pw0").value="";$("pw1").value="";$("pm").textContent="\u2713 Password changed"}catch(e){$("pm").textContent="Current password is wrong or could not change."}};
function fillB(){const s=$("bk");s.textContent="";(isAdm()?Object.keys(bunks):[BK]).forEach(k=>{const o=document.createElement("option");o.value=k;o.textContent=bunks[k];o.selected=k===BK;s.appendChild(o)});}
$("bk").onchange=e=>{BK=e.target.value;BN=bunks[BK];load(cur);};
fillB();$("od").value=today();load(today());
let unsub=null,auth,db;const DOMAIN="vdccws.app";
function subscribe(){if(unsub)unsub();col=db.collection("days");const q=isAdm()?col:col.where("bk","==",users[me].bunk);
  unsub=q.onSnapshot(s=>{days={};s.docs.forEach(d=>{days[d.id]=d.data()});if(!$("v2").hidden)office();if(!dirty)load(cur)},e=>{$("st").textContent="Cannot read data: "+e.code});}
try{firebase.initializeApp(FIREBASE_CONFIG);auth=firebase.auth();db=firebase.firestore();
  auth.onAuthStateChanged(async u=>{
    if(!u){if(unsub){unsub();unsub=null}me=null;days={};$("app").hidden=true;$("lg").hidden=false;return}
    const id=u.email.split("@")[0];
    try{const nm=bunks[id];if(id!=="admin"&&!nm)throw 0;users[id]=id==="admin"?{name:"Admin",role:"admin"}:{name:nm,role:"bunk",bunk:id};me=id;enter(id);subscribe()}
    catch(e){$("lm").textContent="Account is not set up. Please contact admin.";auth.signOut()}});
}catch(e){$("lm").textContent="App is not configured. Check firebase-config.js."}
</script></body></html>
