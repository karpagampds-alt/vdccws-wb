.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input,select{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
label{font-size:12px;color:var(--mu);display:block}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;align-items:end}
button{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 14px;font:inherit;font-weight:600}
button.s{background:transparent;color:var(--ac);border:1px solid var(--ac);padding:5px 10px;font-weight:500;font-size:13px}
button.x{background:transparent;color:var(--rd);border:1px solid var(--rd);padding:3px 8px;font-size:12px}
.lgo{width:52px;height:52px;border-radius:50%;flex:none}.mu{color:var(--mu);font-size:12px}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}th{background:var(--hl)}td.n,th.n{text-align:right}
tr.t th{background:var(--card)}
</style></head><body>

const BR={vellore:"VELLORE",katpadi:"KATPADI",gudiyatham:"GUDIYATHAM",arakonam:"ARAKONAM",walaja:"WALAJA",arcot:"ARCOT",ambur:"AMBUR",vaniyambadi:"VANIYAMBADI",tirupathur:"TIRUPATHUR"};
const DOMAIN="vdccws.app",$=id=>document.getElementById(id);
const qb=(new URLSearchParams(location.search).get("b")||"").toLowerCase(),linkBr=BR[qb]?qb:"";
const f2=v=>(+v||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const dmy=d=>d?d.split("-").reverse().join("-"):"";
let me="",admin=false,br="",rows=[],unsub=null,auth,db,col;
$("lu").value=linkBr;$("bn").textContent=linkBr?BR[linkBr]+" BRANCH":"";
$("li").onclick=async()=>{const id=$("lu").value.trim().toLowerCase();if(!id){$("lm").textContent="Enter User ID.";return}
  $("lm").textContent="Please wait...";
  try{await auth.signInWithEmailAndPassword((id==="admin"?"admin":"inv-"+id)+"@"+DOMAIN,$("lp").value);$("lp").value="";$("lm").textContent=""}
  catch(e){const c=(e&&e.code)||"";$("lm").textContent=c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-email"?"Wrong user ID or password. ("+c+")":"Login error: "+(c||e)}};
$("lp").onkeydown=e=>{if(e.key==="Enter")$("li").click()};
$("lo").onclick=()=>auth.signOut();
function fill(){const s=$("fb");s.textContent="";if(admin){s.add(new Option("All branches",""))}
  Object.keys(BR).forEach(k=>{if(admin||k===br)s.add(new Option(BR[k],k))});s.value=admin?br:br;}
function show(){$("lg").hidden=true;$("app").hidden=false;$("who").textContent=(admin?"Admin":BR[br]+" BRANCH")+(admin&&br?" \u2013 viewing "+BR[br]:"");
  fill();$("fb").disabled=!admin;$("bsc").hidden=!admin;view()}
function sub(){if(unsub)unsub();const q=(admin&&!br)?col:col.where("br","==",br||"none");
  unsub=q.onSnapshot(s=>{rows=s.docs.map(d=>Object.assign({id:d.id},d.data()));view()},e=>{$("dm").textContent="Cannot read data: "+e.code})}
function cur(){const fb=admin?$("fb").value:br,f=$("df").value,t=$("dt").value;
  const r=rows.filter(x=>(!fb||x.br===fb)&&(!f||x.adj>=f)&&(!t||x.adj<=t)).sort((a,b)=>a.adj<b.adj?1:a.adj>b.adj?-1:(b.ts||0)-(a.ts||0));return{r,fb,f,t}}
function view(){if(!me)return;const{r,fb}=cur();let tot=0;r.forEach(x=>tot+=+x.amt||0);
  $("addc").hidden=admin&&!fb;
  if(admin){const g={};r.forEach(x=>{(g[x.br]=g[x.br]||[0,0]);g[x.br][0]++;g[x.br][1]+=+x.amt||0});
    $("bt").innerHTML="<tr><th>Branch</th><th class='n'>Invoices</th><th class='n'>Amount &#8377;</th></tr>"+Object.keys(BR).map(k=>g[k]?`<tr><td>${BR[k]}</td><td class="n">${g[k][0]}</td><td class="n">${f2(g[k][1])}</td></tr>`:`<tr><td>${BR[k]}</td><td class="n mu">0</td><td class="n mu">-</td></tr>`).join("")+`<tr class="t"><th>TOTAL</th><th class="n">${r.length}</th><th class="n">${f2(tot)}</th></tr>`}
  const d={};r.forEach(x=>{(d[x.adj]=d[x.adj]||[0,0]);d[x.adj][0]++;d[x.adj][1]+=+x.amt||0});
  $("dtb").innerHTML="<tr><th>Adj. date</th><th class='n'>Invoices</th><th class='n'>Amount &#8377;</th></tr>"+Object.keys(d).sort().reverse().map(k=>`<tr><td>${dmy(k)}</td><td class="n">${d[k][0]}</td><td class="n">${f2(d[k][1])}</td></tr>`).join("")+`<tr class="t"><th>TOTAL</th><th class="n">${r.length}</th><th class="n">${f2(tot)}</th></tr>`;
  $("lt").innerHTML=`<tr>${admin?"<th>Branch</th>":""}<th>Invoice No</th><th>Invoice date</th><th>Adj. date</th><th class="n">Amount &#8377;</th><th>Remarks</th><th></th></tr>`+r.map(x=>`<tr>${admin?`<td>${BR[x.br]||esc(x.br)}</td>`:""}<td>${esc(x.invNo)}</td><td>${dmy(x.inv)}</td><td>${dmy(x.adj)}</td><td class="n">${f2(x.amt)}</td><td>${esc(x.rem)}</td><td><button class="x" data-d="${x.id}">&#10005;</button></td></tr>`).join("")+`<tr class="t"><th colspan="${admin?4:3}">TOTAL (${r.length})</th><th class="n">${f2(tot)}</th><th colspan="2"></th></tr>`}
["fb","df","dt"].forEach(i=>$(i).onchange=()=>{if(i==="fb"){br=$("fb").value}view()});
$("add").onclick=async()=>{const t=admin?$("fb").value:br,inv=$("idt").value,adj=$("adt").value,amt=parseFloat($("amt").value);
  if(!t||!inv||!adj||!(amt>0)){$("am").textContent="Please fill Invoice date, Adj. date and Amount.";return}
  try{await col.add({br:t,invNo:$("ino").value.trim(),inv,adj,amt,rem:$("rem").value.trim(),by:me,ts:Date.now()});
    ["ino","amt","rem"].forEach(i=>$(i).value="");$("am").textContent="\u2713 Added"}catch(e){$("am").textContent="Could not save. Please try again."}};
$("lt").onclick=async e=>{const b=e.target.closest("button[data-d]");if(!b)return;
  if(!b.dataset.arm){b.dataset.arm=1;b.textContent="Sure?";setTimeout(()=>{b.dataset.arm="";b.innerHTML="&#10005;"},3000);return}
  try{await col.doc(b.dataset.d).delete()}catch(x){$("dm").textContent="Could not delete."}};
const dw={save:async({filename,data})=>{const mime=filename.endsWith(".pdf")?"application/pdf":"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";

async function dl(kind){const{r,fb,f,t}=cur();let tot=0;r.forEach(x=>tot+=+x.amt||0);

    else{if(!window.jspdf)throw 0;const doc=new jspdf.jsPDF({orientation:"portrait",format:"a4"});doc.setFontSize(12);doc.text(ttl.replace("\u2013","-"),14,14);
      doc.autoTable({head:[head.map(h=>h==="Amount"?"Amount (Rs)":h)],body:body.map(b=>b.map((v,i)=>i===4?f2(v):v)).concat([["TOTAL","","","",f2(tot),""]]),startY:20,theme:"grid",styles:{fontSize:8},headStyles:{fillColor:[11,110,79]},columnStyles:{4:{halign:"right"}}});data=doc.output("arraybuffer")}
